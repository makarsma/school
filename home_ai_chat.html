<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домашний AI-чат</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17212b;
      --muted: #66737f;
      --accent: #2563eb;
      --border: #e3e8ee;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 650;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      font-size: 20px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    main {
      flex: 1;
      width: min(1100px, calc(100% - 32px));
      margin: 22px auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .intro {
      padding: 8px 4px 18px;
    }

    .intro h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -0.5px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .chat-card {
      position: relative;
      flex: 1;
      min-height: 650px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(20, 35, 50, 0.07);
    }

    /* Яндекс AI Studio widget самостоятельно добавит интерфейс чата. */
    .chat-host {
      width: 100%;
      height: 100%;
      min-height: 650px;
    }

    footer {
      padding: 14px 20px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      main { width: calc(100% - 16px); margin: 10px auto; }
      .intro { padding: 6px 4px 12px; }
      .chat-card, .chat-host { min-height: 72vh; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">AI</div>
      <div>Домашний AI-чат</div>
    </div>
    <div class="status">Персональный помощник</div>
  </header>

  <main>
    <section class="intro">
      <h1>Чем могу помочь?</h1>
      <p>Общайтесь с вашим AI-агентом прямо на этой странице.</p>
    </section>

    <section class="chat-card">
      <div class="chat-host" id="yandex-ai-chat"></div>
    </section>
  </main>

  <footer>
    Домашняя страница AI-ассистента
  </footer>

  <script
    src="https://widget.aistudio.yandexcloud.net/scripts/widget-loader.js?channel-id=aacfhbabtleakuj15foq"
    async>
  </script>
</body>
</html>
